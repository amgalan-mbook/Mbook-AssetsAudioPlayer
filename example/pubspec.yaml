name: assets_audio_player_example
description: Demonstrates how to use the assets_audio_player plugin.
publish_to: "none"
version: 3.0.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  assets_audio_player:
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

  flutter_neumorphic:
    git:
      url: https://github.com/den0206/Flutter-Neumorphic.git
      ref: feature/remoce_accentcolor
  rxdart: ^0.28.0
  # for local file test
  dio: ^5.11.1
  path_provider: ^2.1.6
  http: ^1.6.0
  provider: ^6.1.5+1
  file: ^7.0.1
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/audios/
    - assets/images/
  fonts:
    - family: AssetAudioPlayer
      fonts:
        - asset: fonts/AssetAudioPlayer.ttf
